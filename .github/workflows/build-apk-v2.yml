name: Build Anime Ascension V17 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Anime Ascension V17 source
        run: |
          mkdir game
          unzip -q AnimeAscensionProjectV17.zip -d game

      - name: Build V17 APK
        run: gradle -p game :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp game/app/build/outputs/apk/debug/app-debug.apk AnimeAscension-v17.0.0.apk

      - name: Upload V17 APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeAscension-APK-V17
          path: AnimeAscension-v17.0.0.apk
