name: Build Anime Ascension APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore tested game project
        run: |
          curl -L --fail \
            -o AnimeAscensionProject.zip \
            "https://raw.githubusercontent.com/de9em9m-svg/Read-me/5d83f17f5469d0102b9479569046375a7eecf93e/AnimeAscensionProject.zip"
          mkdir game
          unzip -q AnimeAscensionProject.zip -d game

      - name: Apply V2 combat upgrade
        run: |
          INDEX="$(find game -path '*/src/main/assets/index.html' -print -quit)"
          test -n "$INDEX"
          python3 - "$INDEX" .github/patches/combat-v2.html <<'PY'
          import sys
          from pathlib import Path
          index_path = Path(sys.argv[1])
          patch_path = Path(sys.argv[2])
          html = index_path.read_text(encoding='utf-8')
          patch = patch_path.read_text(encoding='utf-8')
          if 'anime-ascension-v2-combat' in html:
              raise SystemExit('V2 combat patch is already present')
          if '</body>' in html:
              html = html.replace('</body>', patch + '\n</body>', 1)
          else:
              html += '\n' + patch
          index_path.write_text(html, encoding='utf-8')
          PY

      - name: Build installable debug APK
        run: gradle -p game :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp game/app/build/outputs/apk/debug/app-debug.apk AnimeAscension-v12.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeAscension-APK-V2
          path: AnimeAscension-v12.0.0.apk
